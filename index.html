<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mongyni Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212; /* Dark background */
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .header {
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            font-weight: 700;
        }
        .header p {
            font-size: 16px;
            margin: 0;
            color: #cccccc;
        }
        
        .balance-info {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        .product-btn {
            width: 100%;
            padding: 18px 15px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: opacity 0.2s;
        }
        .product-btn:active {
            opacity: 0.8;
        }

        /* Colors based on stock */
        .btn-green { background-color: #2e8b57; } /* > 50 */
        .btn-orange { background-color: #d2691e; } /* 10 to 50 */
        .btn-red { background-color: #b83a38; } /* < 10 */
        
        .btn-disabled { 
            background-color: #b83a38; /* Red for out of stock */
            cursor: not-allowed; 
            opacity: 0.6;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #333333;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
        }
        .action-btn:active {
            background-color: #444444;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Available products</h1>
        <p>Please select a product to proceed</p>
    </div>

    <div class="balance-info" id="userBalance">Balance: $0.00</div>

    <!-- Products Container -->
    <div id="productsContainer"></div>

    <!-- Add Funds Button -->
    <button id="addFundsBtn" class="action-btn">💳 Add Funds (OxaPay)</button>
    
    <!-- Close / Go Back Button -->
    <button id="closeBtn" class="action-btn" style="background-color: #b83a38; color: #ffd700;">◀ Go Back</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const balance = parseFloat(urlParams.get('balance')) || 0.0;
        const currentProdId = urlParams.get('product') || '';
        const prodStock = parseInt(urlParams.get('stock')) || 0;

        document.getElementById('userBalance').innerText = `Your Balance: $${balance.toFixed(2)}`;

        const products = [
            { id: "office365", name: "Office 365 1TB", price: "$1.30" },
            { id: "hotmail", name: "Hotmail Trusted OAuth2 V8 (7-90 Days)", price: "$0.018" },
            { id: "hotmail_graph", name: "Hotmail Trusted - OAuth2 [Graph] (12-36M)", price: "$0.0190" }
        ];

        const container = document.getElementById('productsContainer');

        products.forEach(prod => {
            const btn = document.createElement('button');
            const icon = "📦";
            let stock = prodStock; // If URL passed stock for this specific product

            if (stock === 0) {
                btn.className = "product-btn btn-disabled";
                btn.innerText = `${icon} ${prod.name} - ${prod.price} | Stock: Out of Stock`;
            } else if (stock < 10) {
                btn.className = "product-btn btn-red";
                btn.innerText = `${icon} ${prod.name} - ${prod.price} | Stock: ${stock}`;
            } else if (stock <= 50) {
                btn.className = "product-btn btn-orange";
                btn.innerText = `${icon} ${prod.name} - ${prod.price} | Stock: ${stock}`;
            } else {
                btn.className = "product-btn btn-green";
                btn.innerText = `${icon} ${prod.name} - ${prod.price} | Stock: ${stock}`;
            }

            btn.addEventListener('click', () => {
                tg.sendData(JSON.stringify({
                    action: "buy_product",
                    product_id: prod.id
                }));
            });

            container.appendChild(btn);
        });

        // Action for Add Funds
        document.getElementById('addFundsBtn').addEventListener('click', () => {
            tg.sendData(JSON.stringify({
                action: "add_funds"
            }));
        });

        // Action for Go Back
        document.getElementById('closeBtn').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
